# AiBotBS Policy Configuration
# Single source of truth for all trading and system policies

# Scheduler Configuration
schedule:
  trailing_5m: "*/5 * * * *"    # Every 5 minutes (second=5)
  trading_15m: "*/15 * * * *"   # Every 15 minutes (second=7)
  regime_1h: "0 * * * *"        # Every hour (second=9)
  risk_1m: "* * * * *"          # Every minute (second=12)
  market_overview: "*/15 * * * *" # Every 15 minutes (second=3)
  telegram_summary_15m: "*/15 * * * *"  # Every 15 minutes (second=11)

scheduler:
  semaphore_limit: 2            # Max concurrent jobs
  retry:
    attempts: 3
    backoff_seconds: [15, 30, 60]
  job_defaults:
    coalesce: true
    max_instances: 1
    misfire_grace_time: 60

idempotency:
  persist_path: "data/runtime_state.json"
  cleanup_interval_hours: 24

# Trading Configuration
trading:
  # Mode Configuration (Single Source of Truth)
  mode: PAPER             # LIVE | PAPER | DRY_RUN
  use_position_tpsl: true
  reduce_only: true
  entry_cooldown_bars: 2

  # Strategy Configuration
  strategy:
    type: single_flip     # single_flip | scale_in
    once_per_bar: true
    same_direction_block: true
    reversal_enabled: true

    # Scale-in strategy (when type=scale_in)
    scale_in:
      enabled: false
      max_ladders: 2
      ladder_size_usdt: 5
      min_dist_pct: 0.5        # her ekleme önceki avg fiyattan en az %0.5 uzak
      add_on_profit_only: true # sadece kâra geçince ekle

  # Risk Management
  risk:
    max_position_size_pct: 0.01  # %1
    max_total_risk_pct: 0.60
    max_leverage: 3.0
    max_drawdown: 0.15      # 15% maximum drawdown
    streak_guard:
      max_losses: 3         # Max consecutive losses
      cooldown_hours: 24    # Cooldown period after max losses
    
    # Risk Assessment Configuration
    risk_assessment:
      correlation_risk:
        market_cap_tiers:
          tier_1: ['BTC', 'ETH']  # >100B market cap
          tier_2: ['ADA', 'SOL', 'DOT', 'AVAX', 'LINK', 'UNI', 'ATOM']  # 10B-100B
          tier_3: ['NEAR', 'ALGO', 'ICP', 'XRP', 'CFX', 'CRO', 'LDO', 'TAO', 'ARB', 'SUI', 'RENDER', 'JUP', 'OP']  # 1B-10B
          tier_4: ['BIO', 'PENGU']  # <1B
        risk_levels:
          tier_1: 25.0  # En düşük korelasyon riski
          tier_2: 35.0  # Orta korelasyon riski
          tier_3: 50.0  # Yüksek korelasyon riski
          tier_4: 70.0  # En yüksek korelasyon riski
        default_unknown: 60.0  # Bilinmeyen coinler için
      
      liquidity_risk:
        volume_thresholds:
          BTC: {high: 50000000, medium: 10000000, low: 1000000}
          ETH: {high: 30000000, medium: 5000000, low: 500000}
          tier_2: {high: 10000000, medium: 2000000, low: 200000}
          tier_3: {high: 5000000, medium: 1000000, low: 100000}
          tier_4: {high: 1000000, medium: 200000, low: 20000}
        default_unknown: 50.0
      
      volatility_risk:
        volatility_thresholds:
          BTC: {low: 0.15, medium: 0.35, high: 0.55}  # BTC daha stabil
          ETH: {low: 0.20, medium: 0.40, high: 0.60}  # ETH orta volatilite
          tier_2: {low: 0.25, medium: 0.45, high: 0.65}  # Major altcoinler
          tier_3: {low: 0.30, medium: 0.50, high: 0.70}  # Mid-cap altcoinler
          tier_4: {low: 0.35, medium: 0.55, high: 0.75}  # Small-cap altcoinler
        default_unknown: 0.40
      
      market_risk:
        base_risk: 30.0  # Temel piyasa riski
        volatility_penalty: 20.0  # Volatilite cezası
        trend_bonus: 10.0  # Trend bonusu
        extreme_change_threshold: 0.2  # %20 değişim eşiği
        strong_trend_threshold: 0.1  # %10 trend gücü eşiği
        min_risk: 10.0
        max_risk: 90.0
      
      score_risk:
        long_thresholds:
          strong: 80.0  # Güçlü sinyal
          medium: 60.0  # Orta sinyal
          weak: 50.0    # Zayıf sinyal
        short_thresholds:
          strong: 20.0  # Güçlü sinyal
          medium: 40.0  # Orta sinyal
          weak: 50.0    # Zayıf sinyal
        risk_levels:
          strong: 20.0  # Düşük risk
          medium: 40.0  # Orta risk
          weak: 60.0    # Yüksek risk
          very_weak: 80.0  # Çok yüksek risk
  
  # Execution
  execution:
    default_timeout: 30     # Seconds to wait for order execution
    retry_attempts: 3       # Number of retry attempts
    slippage_tolerance: 0.001  # 0.1% slippage tolerance
    min_order_size: 10      # Minimum order size in USD
    max_order_size: 10000   # Maximum order size in USD
  
  # Scoring
  scoring:
    ta_weight: 0.4          # Technical Analysis weight
    ml_weight: 0.25         # Machine Learning weight
    news_weight: 0.2        # News sentiment weight
    risk_weight: 0.15       # Risk score weight
    min_composite_score: 0.6  # Minimum score to execute trade
    
    # Signal Thresholds (Single Source of Truth)
    decision_thresholds:
      enter_long: 60        # Score >= 60: LONG entry
      exit_long: 45         # Score <= 45: LONG exit/reversal
      enter_short: 40       # Score <= 40: SHORT entry
      exit_short: 55        # Score >= 55: SHORT exit/reversal
      flat_range: [45, 55]  # 45-55 arası: FLAT (neutral zone)
    
    # Signal Gating
    signal:
      persistence_bars: 2     # Signal must persist N bars
      rev_confirm_bars: 2     # Reversal confirmation bars
      rev_strength_min: 0.6   # Minimum reversal strength (0-1)
      max_signal_age_bars: 6  # Maximum signal age
      
    # Position Sizing
    position_sizing:
      min_percentage: 0.01  # %1 minimum
      max_percentage: 0.10  # %10 maximum
      score_multiplier: 0.09 # Skor çarpanı
      regime_multiplier: 0.6 # Low ADX regime multiplier
      
    # Risk Management (NO daily loss limits)
    risk_management:
      fees_bps: 6                 # Trading fees in basis points
      slippage_bps: 3             # Slippage buffer in basis points
      batch_size: 5               # Symbols per batch for processing
      max_position_age_hours: 24  # Max 24h position age
      max_position_size_pct: 0.10 # Max 10% per position
      max_total_risk_pct: 0.60    # Max 60% total risk
      max_concurrent_positions: 20 # Max 20 positions
      
    # Regime Filtering
    regime:
      adx_1h_min: 22              # Minimum ADX for trend mode
      low_adx_threshold: 15       # Low ADX threshold
      
    # Position Management
    position_management:
      min_hold_bars: 3            # Min bars before signal-based exit
      cooldown:
        base_bars: 2              # Base cooldown (15m: 30min)
        max_bars: 16              # Max cooldown (15m: 4h)
        loss_multiplier: 0.5      # +50% per consecutive loss
        same_direction_delay: 1   # +1 bar for same direction re-entry
      
    # Trailing Stops
    trailing:
      activation_r_multiple: 0.5  # Activate at +0.5R
      breakeven_r_multiple: 1.0   # Move to BE at +1.0R
      tight_r_multiple: 1.5       # Tight stop at +1.5R
      tight_offset: 0.3           # Tight stop offset (+0.3R)
      
    # Regime Filtering
    regime:
      adx_1h_min: 22              # Min ADX for trend mode
      low_adx_threshold: 20       # Below this: mean reversion mode
      
    # Reversal Policy
    reversal:
      edge_cost_ratio_min: 1.5    # Expected move / (fees + slippage)
      atr_coefficient: 1.0        # ATR multiplier for expected move
      score_distance_coefficient: 0.1 # Score distance multiplier
      fees_bps: 0.05              # Trading fees (0.05%)
      slippage_bps: 0.02          # Slippage buffer (0.02%)

# Agent System Configuration
agents:
  # Orchestrator
  orchestrator:
    enabled: true
    max_concurrent_tasks: 5
    task_timeout: 300       # 5 minutes
    retry_policy:
      max_retries: 3
      backoff_factor: 2
  
  # Signal Agents
  signal_agent:
    enabled: true
    update_interval: 60     # 1 minute
    max_signals_per_hour: 10
  
  ta_agent:
    enabled: true
    indicators: ["RSI", "MACD", "BB", "ATR", "SMA"]
    warmup_periods: 100
    update_interval: 300    # 5 minutes
  
  ml_agent:
    enabled: true
    model_path: "pipelines/training/models/"
    fallback_score: 0.5     # Neutral score when model fails
    update_interval: 3600   # 1 hour
  
  news_agent:
    enabled: true
    sources: ["cryptocompare", "cryptopanic", "coinstats"]
    update_interval: 900    # 15 minutes
    sentiment_threshold: 0.6
  
  risk_agent:
    enabled: true
    check_interval: 60      # 1 minute
    max_risk_score: 0.8     # Maximum allowed risk score
  
  execution_agent:
    enabled: true
    order_timeout: 60       # 1 minute
    bracket_timeout: 300    # 5 minutes
    partial_fill_threshold: 0.9  # 90% fill threshold
  
  portfolio_agent:
    enabled: true
    rebalance_interval: 3600  # 1 hour
    max_positions: 10
  
  qa_agent:
    enabled: true
    health_check_interval: 300  # 5 minutes
    consistency_check_interval: 1800  # 30 minutes

# Exchange Configuration
exchange:
  name: "okx"
  testnet: false
  mode: "paper"  # paper, live - CHANGED TO PAPER FOR SAFETY!
  api_key: "${OKX_API_KEY}"
  secret: "${OKX_API_SECRET}"
  passphrase: "${OKX_API_PASSPHRASE}"
  sandbox: false
  rate_limit:
    requests_per_second: 10
    burst_limit: 20
  
  # Symbol mapping
  symbols:
    default_quote: "USDT"
    # Majors only (cost optimization, reduced from 23 → 3 symbols)
    # ENV override: SYMBOLS env variable can override this list
    supported_pairs: ["BTC", "ETH", "SOL"]
    # Trading symbols (pairs)
    trading_pairs: ["BTC-USDT-SWAP", "ETH-USDT-SWAP", "SOL-USDT-SWAP"]
  
  # Symbol-specific overrides for minimum order requirements (disabled - using dynamic calculation)
  # symbol_overrides: {}

# Telegram Configuration
telegram:
  enabled: true
  token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"
  notifications:
    trading_signals: true
    risk_alerts: true
    portfolio_updates: true
    system_status: true
  
  # Order types
  order_types:
    - "market"
    - "limit"
    - "stop"
    - "trigger"

# Notification Configuration
notifications:
  telegram:
    enabled: true
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
    alerts:
      - "trade_executed"
      - "risk_alert"
      - "system_status"
      - "daily_summary"
  
  email:
    enabled: false
    smtp_server: ""
    smtp_port: 587
    username: ""
    password: ""

# Logging Configuration
logging:
  level: "INFO"
  format: "json"
  summary_mode: "line"  # line (single line) or block (multi-line panel)
  handlers:
    - "console"
    - "file"
  file:
    path: "logs/"
    max_size: "100MB"
    backup_count: 5
  dedup:
    enabled: true
    ttl_seconds: 3600  # Only log same message once per hour
  news_verbosity: "summary"  # summary (compact) or full (verbose)

# Performance Monitoring
performance:
  enabled: true
  metrics_interval: 60      # 1 minute
  storage:
    type: "sqlite"
    path: "data/performance.db"
  
  # Key metrics to track
  metrics:
    - "pnl"
    - "win_rate"
    - "sharpe_ratio"
    - "max_drawdown"
    - "total_trades"
    - "avg_trade_duration"

# Bias Service Configuration
bias:
  enabled: false  # Disabled by default for safety
  
  # Trend filter: block shorts in uptrend, block longs in downtrend
  trend_filter:
    enabled: true
  
  # News guard: block trades on high-impact news
  news_guard:
    enabled: true
    threshold: 0.7          # News score threshold (0.0-1.0)
    categories: ["REGULATION", "SECURITY"]  # High-impact categories
    action: "block"         # block, downgrade
    cooldown_sec: 3600      # 1 hour cooldown
  
  # Volatility guard: downgrade on high volatility
  volatility_guard:
    enabled: true
    atr_limit_pct: 0.05     # 5% ATR threshold
    penalty: 15             # Score penalty for high volatility
  
  # Funding guard: optional funding rate bias
  funding_guard:
    enabled: false          # Disabled by default
    min_abs: 0.0001        # Minimum absolute funding rate
    action: "downgrade"     # downgrade, block
    penalty: 10             # Score penalty
  
  # Correlation guard: block high correlation trades
  corr_guard:
    enabled: true
    max_correlation: 0.8    # Maximum correlation threshold
    max_exposure: 0.15      # Maximum portfolio exposure

# Development Configuration
development:
  debug_mode: false
  mock_exchange: false
  mock_news: false
  test_mode: false
  
  # Feature flags
  features:
    advanced_risk_management: true
    ml_scoring: true
    news_integration: true
    telegram_bot: true
    performance_tracking: true

# Machine Learning Configuration
ml_scoring:
  enabled: true
  model:
    path: "models/rf_v1.pkl"
    type: "RandomForest"
    version: "v1"
    auto_reload: false  # Auto-reload if new model detected
  
  scoring:
    # Confidence thresholds
    confidence:
      high_threshold: 0.30    # |p_up - 0.5| > 0.30 = high confidence
      medium_threshold: 0.15  # |p_up - 0.5| > 0.15 = medium
      # low: rest
    
    # Neutral band (ignore weak signals)
    neutral_band:
      enabled: true
      lower: 0.45  # If p_up in [0.45, 0.55], treat as neutral
      upper: 0.55
    
    # Score adjustment
    score_multiplier: 1.0  # Multiply ML score if needed
    
  fallback:
    enabled: true
    neutral_score: 50.0  # Fallback to neutral if model unavailable
    variation: 5.0       # Add random [-5, +5] variation to avoid bias

# News System Configuration
news:
  lookback_hours_bootstrap: 24
  poll_interval_sec: 300
  overlap_minutes: 15  # Reduced from 30 (less duplicate CHANGED triggers)
  dedupe:
    key_fields: ["url", "title"]
  storage_paths:
    watermarks: "data/news_watermarks.json"
    digests: "data/news_llm_digest.json"
    news_store: "data/news_storage.json"
  
news_llm:
  enabled: true
  digest:
    max_items_per_symbol: 30
  cache:
    ttl_minutes: 120  # Increased from 60 (better cache hit rate, lower cost)
    invalidate_on_digest_change: true

news_scoring:
  thresholds:
    specific: 0.70
    mixed: 0.30
  weights:
    symbol_specific: 1.0
    mixed_shared: 0.6
    general_market: 0.2
  majors_bonus: 0.1  # BTC/ETH için ek ağırlık

# Analysis Cards Configuration
analysis_cards:
  enabled: true  # 0/1 ile aç/kapa
  send_on_startup: true  # Başlangıçta gönder
  send_on_shutdown: true  # Kapanışta gönder
  trading_analysis:
    enabled: true  # 15dk analiz kartları
    include_scores: true
    include_news: true
    include_risk: true
    include_decision: true

# Monitoring Configuration
monitoring:
  prometheus:
    enabled: true
    port: 8000
  alerts:
    drawdown_threshold: 0.10
    exposure_threshold: 0.70
    loss_streak_threshold: 3
