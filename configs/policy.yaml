schedule:
  trailing_5m: '*/5 * * * *'
  trading_15m: '*/15 * * * *'
  regime_1h: 0 * * * *
  risk_1m: '* * * * *'
  market_overview: '*/15 * * * *'
scheduler:
  semaphore_limit: 2
  retry:
    attempts: 3
    backoff_seconds:
    - 15
    - 30
    - 60
  job_defaults:
    coalesce: true
    max_instances: 1
    misfire_grace_time: 60
idempotency:
  persist_path: data/runtime_state.json
  cleanup_interval_hours: 24
trading:
  mode: LIVE
  use_position_tpsl: true
  reduce_only: true
  entry_cooldown_bars: 2
  strategy:
    type: single_flip
    once_per_bar: true
    same_direction_block: true
    reversal_enabled: true
    scale_in:
      enabled: false
      max_ladders: 2
      ladder_size_usdt: 5
      min_dist_pct: 0.5
      add_on_profit_only: true
  risk:
    max_position_size_pct: 0.01
    max_total_risk_pct: 0.6
    leverage:
      min_leverage: 1
      max_leverage: 10
      default: 5
      symbol_limits:
        BTC:
          max: 10
        ETH:
          max: 10
        SOL:
          max: 10
    max_drawdown: 0.15
    streak_guard:
      max_losses: 3
      cooldown_hours: 24
    risk_assessment:
      correlation_risk:
        market_cap_tiers:
          tier_1:
          - BTC
          - ETH
          tier_2:
          - ADA
          - SOL
          - DOT
          - AVAX
          - LINK
          - UNI
          - ATOM
          tier_3:
          - NEAR
          - ALGO
          - ICP
          - XRP
          - CFX
          - CRO
          - LDO
          - TAO
          - ARB
          - SUI
          - RENDER
          - JUP
          - OP
          tier_4:
          - BIO
          - PENGU
        risk_levels:
          tier_1: 25.0
          tier_2: 35.0
          tier_3: 50.0
          tier_4: 70.0
        default_unknown: 60.0
      liquidity_risk:
        volume_thresholds:
          BTC:
            high: 50000000
            medium: 10000000
            low: 1000000
          ETH:
            high: 30000000
            medium: 5000000
            low: 500000
          tier_2:
            high: 10000000
            medium: 2000000
            low: 200000
          tier_3:
            high: 5000000
            medium: 1000000
            low: 100000
          tier_4:
            high: 1000000
            medium: 200000
            low: 20000
        default_unknown: 50.0
      volatility_risk:
        volatility_thresholds:
          BTC:
            low: 0.15
            medium: 0.35
            high: 0.55
          ETH:
            low: 0.2
            medium: 0.4
            high: 0.6
          tier_2:
            low: 0.25
            medium: 0.45
            high: 0.65
          tier_3:
            low: 0.3
            medium: 0.5
            high: 0.7
          tier_4:
            low: 0.35
            medium: 0.55
            high: 0.75
        default_unknown: 0.4
      market_risk:
        base_risk: 30.0
        volatility_penalty: 20.0
        trend_bonus: 10.0
        extreme_change_threshold: 0.2
        strong_trend_threshold: 0.1
        min_risk: 10.0
        max_risk: 90.0
      score_risk:
        long_thresholds:
          strong: 80.0
          medium: 60.0
          weak: 50.0
        short_thresholds:
          strong: 20.0
          medium: 40.0
          weak: 50.0
        risk_levels:
          strong: 20.0
          medium: 40.0
          weak: 60.0
          very_weak: 80.0
  execution:
    default_timeout: 30
    retry_attempts: 3
    slippage_tolerance: 0.001
    min_order_size: 10
    max_order_size: 10000
  scoring:
    ta_weight: 0.55
    ml_weight: 0.35
    news_weight: 0.05
    risk_weight: 0.05
    min_composite_score: 0.6
    decision_thresholds:
      enter_long: 60
      exit_long: 45
      enter_short: 35
      exit_short: 52
      flat_range:
      - 45
      - 55
    signal:
      persistence_bars: 2
      rev_confirm_bars: 2
      rev_strength_min: 0.6
      max_signal_age_bars: 6
      confirmation_margin: 2.0
    ml_boost:
      enabled: true
      tiers:
        - ta_threshold: 65
          multiplier: 3
        - ta_threshold: 70
          multiplier: 4
    risk_management:
      fees_bps: 6
      slippage_bps: 3
      batch_size: 5
      max_position_age_hours: 24
      max_position_size_pct: 0.1
      max_total_risk_pct: 0.6
      max_concurrent_positions: 20
    regime:
      adx_1h_min: 22
      low_adx_threshold: 20
    position_management:
      min_hold_bars: 3
      cooldown:
        base_bars: 2
        max_bars: 16
        loss_multiplier: 0.5
        same_direction_delay: 1
    trailing:
      enabled: true
      activation_r_multiple: 0.5
      breakeven_r_multiple: 1.0
      tight_r_multiple: 1.5
      tight_offset: 0.3
      update_interval_seconds: 60
    partial_tp:
      enabled: true
      levels:
      - r_multiple: 1.0
        close_pct: 0.33
      - r_multiple: 2.0
        close_pct: 0.33
      - r_multiple: 4.0
        close_pct: 0.34
    time_exit:
      enabled: true
      max_position_age_hours: 24
      stale_position_action: close
      warning_hours: 20
    scalable_sizing:
      enabled: true
      max_portfolio_allocation: 0.6
      per_position_max: 0.1
      dynamic_sizing: true
    position_sizing:
      strategy: tier_based
      min_percentage: 0.05
      max_percentage: 0.15
      score_multiplier: 0.09
      regime_multiplier: 0.6
      tiers:
        weak:
          min_strength: 0.0
          max_strength: 0.3
          position_pct: 0.02
        medium:
          min_strength: 0.3
          max_strength: 0.5
          position_pct: 0.04
        strong:
          min_strength: 0.5
          max_strength: 0.7
          position_pct: 0.06
        extreme:
          min_strength: 0.7
          max_strength: 1.0
          position_pct: 0.08
      balance:
        use_type: free
        snapshot_interval_sec: 600
        update_after_trade: true
      risk_score:
        affects_sizing: false
        warning_threshold: 70
    max_concurrent:
      enabled: true
      hard_limit: 20
      per_symbol_limit: 1
      enforce_before_trade: true
    dynamic_tpsl:
      enabled: true
      volatility_threshold: 0.2
      min_check_interval_min: 15
    oco_cleanup:
      enabled: true
      run_on_startup: true
      run_interval_min: 60
    reversal:
      confirmation_bar: false
      edge_cost_ratio_min: 1.5
      atr_coefficient: 1.0
      score_distance_coefficient: 0.1
      fees_bps: 0.05
      slippage_bps: 0.02
  trailing:
    enabled: true
  partial_tp:
    enabled: true
  dynamic_tpsl:
    enabled: true
  time_exit:
    enabled: true
agents:
  orchestrator:
    enabled: true
    max_concurrent_tasks: 5
    task_timeout: 300
    retry_policy:
      max_retries: 3
      backoff_factor: 2
  signal_agent:
    enabled: true
    update_interval: 60
    max_signals_per_hour: 10
  ta_agent:
    enabled: true
    indicators:
    - RSI
    - MACD
    - BB
    - ATR
    - SMA
    warmup_periods: 100
    update_interval: 300
  ml_agent:
    enabled: true
    model_path: pipelines/training/models/
    fallback_score: 0.5
    update_interval: 3600
  news_agent:
    enabled: true
    sources:
    - cryptocompare
    - cryptopanic
    - coinstats
    update_interval: 900
    sentiment_threshold: 0.6
  risk_agent:
    enabled: true
    check_interval: 60
    max_risk_score: 0.8
  execution_agent:
    enabled: true
    order_timeout: 60
    bracket_timeout: 300
    partial_fill_threshold: 0.9
  portfolio_agent:
    enabled: true
    rebalance_interval: 3600
    max_positions: 10
  qa_agent:
    enabled: true
    health_check_interval: 300
    consistency_check_interval: 1800
exchange:
  name: okx
  testnet: false
  mode: live
  api_key: ${OKX_API_KEY}
  secret: ${OKX_API_SECRET}
  passphrase: ${OKX_API_PASSPHRASE}
  sandbox: false
  rate_limit:
    requests_per_second: 10
    burst_limit: 20
  symbols:
    default_quote: USDT
    supported_pairs:
    - BTC
    - ETH
    - SOL
    trading_pairs:
    - BTC-USDT-SWAP
    - ETH-USDT-SWAP
    - SOL-USDT-SWAP
    - GRT-USDT-SWAP
    - ARKM-USDT-SWAP
    - SUI-USDT-SWAP
telegram:
  enabled: true
  token: ${TELEGRAM_BOT_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}
  notifications:
    trading_signals: true
    risk_alerts: true
    portfolio_updates: true
    system_status: true
  order_types:
  - market
  - limit
  - stop
  - trigger
notifications:
  telegram:
    enabled: true
    bot_token: ${TELEGRAM_BOT_TOKEN}
    chat_id: ${TELEGRAM_CHAT_ID}
    alerts:
    - trade_executed
    - risk_alert
    - system_status
    - daily_summary
  email:
    enabled: false
    smtp_server: ''
    smtp_port: 587
    username: ''
    password: ''
logging:
  level: INFO
  format: json
  summary_mode: line
  handlers:
  - console
  - file
  file:
    path: logs/
    max_size: 100MB
    backup_count: 5
  dedup:
    enabled: true
    ttl_seconds: 3600
  news_verbosity: summary
performance:
  enabled: true
  metrics_interval: 60
  storage:
    type: sqlite
    path: data/performance.db
  metrics:
  - pnl
  - win_rate
  - sharpe_ratio
  - max_drawdown
  - total_trades
  - avg_trade_duration
bias:
  enabled: false
  trend_filter:
    enabled: true
  news_guard:
    enabled: true
    threshold: 0.7
    categories:
    - REGULATION
    - SECURITY
    action: block
    cooldown_sec: 3600
  volatility_guard:
    enabled: true
    atr_limit_pct: 0.05
    penalty: 15
  funding_guard:
    enabled: false
    min_abs: 0.0001
    action: downgrade
    penalty: 10
  corr_guard:
    enabled: true
    max_correlation: 0.8
    max_exposure: 0.15
development:
  debug_mode: false
  mock_exchange: false
  mock_news: false
  test_mode: false
  features:
    advanced_risk_management: true
    ml_scoring: true
    news_integration: true
    telegram_bot: true
    performance_tracking: true
ml_scoring:
  enabled: true
  model:
    type: LightGBM
    auto_reload: false
  scoring:
    confidence:
      high_threshold: 0.3
      medium_threshold: 0.15
    neutral_band:
      enabled: true
      lower: 0.45
      upper: 0.55
    score_multiplier: 1.0
  fallback:
    enabled: true
    neutral_score: 50.0
    variation: 5.0
news:
  lookback_hours_bootstrap: 24
  poll_interval_sec: 300
  overlap_minutes: 15
  dedupe:
    key_fields:
    - url
    - title
  storage_paths:
    watermarks: data/news_watermarks.json
    digests: data/news_llm_digest.json
    news_store: data/news_storage.json
news_llm:
  enabled: true
  digest:
    max_items_per_symbol: 30
  cache:
    ttl_minutes: 120
    invalidate_on_digest_change: true
news_scoring:
  thresholds:
    specific: 0.7
    mixed: 0.3
  weights:
    symbol_specific: 1.0
    mixed_shared: 0.6
    general_market: 0.2
  majors_bonus: 0.1
analysis_cards:
  enabled: true
  send_on_startup: true
  send_on_shutdown: true
  trading_analysis:
    enabled: true
    include_scores: true
    include_news: true
    include_risk: true
    include_decision: true
monitoring:
  prometheus:
    enabled: true
    port: 8000
  alerts:
    drawdown_threshold: 0.1
    exposure_threshold: 0.7
    loss_streak_threshold: 3
