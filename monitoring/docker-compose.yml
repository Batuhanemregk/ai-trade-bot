services:
  # Prometheus - Metrics toplama ve saklama
  prometheus:
    image: prom/prometheus:latest
    container_name: aibot_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"  # Prometheus web UI
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml  # Config
      - prometheus_data:/prometheus  # Data storage
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'  # 30 gün data saklama
      - '--web.enable-lifecycle'
    networks:
      - monitoring

  # Grafana - Görselleştirme ve dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: aibot_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"  # Grafana web UI
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin  # İLK GİRİŞTEN SONRA DEĞİŞTİR!
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=localhost
      - GF_SMTP_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana  # Data storage
      - ./grafana/provisioning:/etc/grafana/provisioning  # Auto-provisioning
    depends_on:
      - prometheus
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

